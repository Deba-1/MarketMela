<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Market Mela - Best Deals Online</title>
    
    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <style>
        :root {
            --primary: #F5A623;
            --secondary: #B31221;
            --accent: #6B0F1A;
            --bg-color: #FFF9F0;
            --white: #ffffff;
            --text-dark: #222222;
            --text-gray: #666666;
            --price-color: #B31221;
            --star-color: #FFA41C;
            --discount-red: #B31221;
            --coupon-green: #188338;
            --btn-bg: #188338;
            --btn-hover: #12632A;
        }

        body { 
            font-family: 'Amazon Ember', Arial, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        header { background: var(--primary); color: #fff; padding: 10px 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: auto; }
        .logo { font-size: 24px; font-weight: 800; text-decoration: none; color: var(--secondary); display: flex; align-items: center; letter-spacing: 1px; }
        .logo span { color: #ffffff; font-style: normal; margin-left: 2px; }
        .search-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 5px; transition: background 0.2s; }
        .search-icon:hover { background: rgba(0,0,0,0.1); }
        .search-icon svg { width: 22px; height: 22px; stroke: var(--secondary); }
        .search-bar-container { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; max-width: 1200px; margin: auto; }
        .search-bar-container.active { max-height: 60px; margin-top: 10px; }
        .search-input { width: 100%; padding: 12px 15px; border-radius: 6px; border: 2px solid var(--secondary); outline: none; font-size: 16px; box-sizing: border-box; }

        .main-content { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding-bottom: 30px; }
        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 38px 12px; padding: 12px; }
        @media (min-width: 768px) {
            .container { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px 20px; padding: 20px; }
        }

        .card { background: var(--white); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; position: relative; height: 100%; border: 1px solid #f0e2d0; overflow: hidden; }
        @media (min-width: 768px) { .card { border-radius: 8px; } .card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); } }

        .img-container { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; padding: 2px; box-sizing: border-box; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .details { text-align: left; }
        .title { font-size: 14px; color: var(--text-dark); line-height: 1.3; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; font-weight: 600; }
        
        .rating { color: var(--star-color); font-size: 13px; letter-spacing: 0px; margin-bottom: 4px; }
        .price-block { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
        .price-val { font-size: 20px; font-weight: 700; color: var(--price-color); }
        .mrp { font-size: 11px; color: var(--text-gray); text-decoration: line-through; }
        .discount-txt { font-size: 12px; color: var(--discount-red); font-weight: normal; }

        .btn { background: var(--btn-bg); color: #ffffff; text-decoration: none; padding: 8px; border-radius: 20px; font-size: 13px; font-weight: 600; text-align: center; margin-top: 8px; display: block; border: none; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--btn-hover); }

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 30px 0 10px 0; }
        .page-btn { background: white; border: 1px solid var(--secondary); padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 14px; text-decoration: none; color: var(--secondary); font-weight: 600; }
        .page-btn.disabled { opacity: 0.5; pointer-events: none; background: #eee; border-color: #ccc; color: #888; }
        .page-info { font-size: 14px; color: var(--text-dark); font-weight: 600; }

        footer { background: var(--accent); color: white; padding-top: 0; text-align: center; margin-top: auto; }
        .back-to-top { background: var(--secondary); color: white; padding: 12px; font-size: 13px; cursor: pointer; margin-bottom: 25px; font-weight: 600; }
        .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 25px; padding: 0 20px; }
        .footer-links a { color: #f2c94c; text-decoration: none; font-size: 13px; font-weight: 500; }
        .copyright { font-size: 12px; color: #dddddd; padding-bottom: 20px; }
        .no-results { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-gray); font-size: 18px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="nav-wrapper">
            <a href="index.html" class="logo">MARKET<span>MELA</span></a>
            <div class="search-icon" onclick="toggleSearch()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
        <div class="search-bar-container" id="searchContainer">
            <input type="text" class="search-input" id="searchInput" placeholder="Search across all products...">
        </div>
    </header>

    <div class="main-content">
        <div class="container" id="product-list"></div>
        <div class="pagination-container" id="paginationControls">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
            <span class="page-info" id="pageIndicator">Page 1</span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
        <div id="noResults" class="no-results">No products found matching your search.</div>
    </div>

    <footer>
        <div class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">Back to top</div>
        <div class="footer-links">
            <a href="about.html">About Us</a> 
            <a href="privacy.html">Privacy Policy</a> 
            <a href="contact.html">Contact Us</a>
        </div>
        <div class="copyright">&copy; Market Mela. Associated with Amazon.</div>
    </footer>

    <script src="links.js"></script>

    <script>
        const container = document.getElementById('product-list');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const paginationControls = document.getElementById('paginationControls');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        const BATCH_SIZE = 24;
        
        const urlParams = new URLSearchParams(window.location.search);
        let currentPage = parseInt(urlParams.get('page')) || 1;

        function toggleSearch() {
            const el = document.getElementById('searchContainer');
            el.classList.toggle('active');
            if(el.classList.contains('active')) document.getElementById('searchInput').focus();
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();

            if (query === '') {
                paginationControls.style.display = 'flex';
                noResults.style.display = 'none';
                loadPage(currentPage);
                return;
            }

            paginationControls.style.display = 'none';
            container.innerHTML = "";
            let matchCount = 0;

            products.forEach(item => {
                if (item && item.title && item.title.toLowerCase().includes(query)) {
                    container.appendChild(createCard(item));
                    matchCount++;
                }
            });

            noResults.style.display = matchCount === 0 ? 'block' : 'none';
        });

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage < 1) return;
            const maxPages = Math.ceil(products.length / BATCH_SIZE);
            if (newPage > maxPages) return;
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('page', newPage);
            window.history.pushState({}, '', newUrl);
            
            currentPage = newPage;
            loadPage(currentPage);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function loadPage(page) {
            if (typeof products === 'undefined' || !Array.isArray(products)) return;

            container.innerHTML = "";
            const start = (page - 1) * BATCH_SIZE;
            const end = start + BATCH_SIZE;
            const batchItems = products.slice(start, end);
            
            pageIndicator.innerText = `Page ${page}`;
            prevBtn.classList.toggle('disabled', page === 1);
            const maxPages = Math.ceil(products.length / BATCH_SIZE) || 1;
            nextBtn.classList.toggle('disabled', page >= maxPages);

            if (batchItems.length === 0) {
                container.innerHTML = "<h3 style='text-align:center;width:100%;grid-column:1/-1;'>No products found here.</h3>";
                return;
            }

            batchItems.forEach(item => {
                container.appendChild(createCard(item));
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'card';

            let priceHtml = '';
            if (item.mrp && item.discount) {
                priceHtml = `
                    <span class="price-val">₹${item.price}</span>
                    <span class="mrp">${item.mrp}</span>
                    <span class="discount-txt">${item.discount}</span>
                `;
            } else {
                priceHtml = `<span class="price-val">₹${item.price}</span>`;
            }

            card.innerHTML = `
                <div class="img-container">
                    <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='android-chrome-192x192.png';">
                </div>
                <div class="details">
                    <div class="title">${item.title}</div>
                    <div class="rating">★★★★☆</div>
                    <div class="price-block">${priceHtml}</div>
                </div>
                <a href="${item.link}" target="_blank" class="btn">Check Details</a>
            `;
            return card;
        }

        window.onload = () => loadPage(currentPage);
    </script>
</body>
</html>
